<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cartoLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="edgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="lightDotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(15, 23, 42, 0.06)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#cartoLightBg)"/>
  <rect width="600" height="340" fill="url(#lightDotGrid)"/>

  <!-- Dependency Graph Nodes -->
  <g transform="translate(300, 165)">
    <!-- Connections -->
    <path d="M 0 -75 L -120 -15" stroke="url(#edgeBlue)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.75"/>
    <path d="M 0 -75 L 0 -5" stroke="url(#edgeBlue)" stroke-width="2.5" opacity="0.85"/>
    <path d="M 0 -75 L 120 -15" stroke="url(#edgeBlue)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.75"/>
    
    <path d="M -120 -15 L -140 65" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M -120 -15 L -60 65" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M 0 -5 L -60 65" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M 0 -5 L 60 65" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M 120 -15 L 60 65" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M 120 -15 L 140 65" stroke="#94a3b8" stroke-width="1.8"/>

    <!-- Central Orchestrator Node -->
    <g transform="translate(0, -75)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="drop-shadow(0 4px 10px rgba(37,99,235,0.15))"/>
      <circle cx="-60" cy="0" r="5" fill="#10b981"/>
      <text x="-48" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#0f172a">🎯 ORQUESTADOR</text>
    </g>

    <!-- Sub-agents Nodes Level 1 -->
    <g transform="translate(-120, -15)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.06))"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">🏛️ Arquitectura</text>
    </g>

    <g transform="translate(0, -5)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.06))"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">🔀 Flujos de Código</text>
    </g>

    <g transform="translate(120, -15)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.06))"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#4338ca" text-anchor="middle">🗄️ Modelo ERD</text>
    </g>

    <!-- Modules Level 2 -->
    <g transform="translate(-140, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#475569" text-anchor="middle">Metrics</text>
    </g>

    <g transform="translate(-60, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#059669" text-anchor="middle">CVE Risk</text>
    </g>

    <g transform="translate(60, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#475569" text-anchor="middle">Tour Guide</text>
    </g>

    <g transform="translate(140, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#475569" text-anchor="middle">Entities</text>
    </g>
  </g>

  <!-- Left Card: Cero Alucinaciones -->
  <g transform="translate(30, 35)">
    <rect width="180" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#64748b">PRINCIPIO BASE</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#2563eb">CERO ALUCINACIONES</text>
    <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669">&lt;detectado&gt; vs &lt;inferido&gt;</text>
  </g>

  <!-- Right Card: 9 Agentes IA -->
  <g transform="translate(415, 35)">
    <rect width="155" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#64748b">ARQUITECTURA</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#4f46e5">9 AGENTES IA</text>
    <text x="14" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">Next.js 16 + React 19</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(160, 280)">
    <rect width="280" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="140" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">github.com/LuchoDB/Cartografo</text>
  </g>
</svg>
