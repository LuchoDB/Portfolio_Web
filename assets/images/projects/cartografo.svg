<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cartoCodeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#050a17"/>
      <stop offset="100%" stop-color="#02060f"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#cartoCodeBg)"/>
  <rect width="600" height="340" fill="url(#dotGrid)"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="170" r="150" fill="#38bdf8" opacity="0.08" filter="blur(50px)"/>

  <!-- Dependency Graph / Software Architecture Map -->
  <g transform="translate(300, 165)">
    <!-- Connections / Edges -->
    <path d="M 0 -75 L -120 -15" stroke="url(#edgeGlow)" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    <path d="M 0 -75 L 0 -5" stroke="url(#edgeGlow)" stroke-width="2.5" opacity="0.8"/>
    <path d="M 0 -75 L 120 -15" stroke="url(#edgeGlow)" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
    
    <path d="M -120 -15 L -140 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>
    <path d="M -120 -15 L -60 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>
    <path d="M 0 -5 L -60 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>
    <path d="M 0 -5 L 60 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>
    <path d="M 120 -15 L 60 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>
    <path d="M 120 -15 L 140 65" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.8"/>

    <!-- Central Orchestrator Node (Root) -->
    <g transform="translate(0, -75)">
      <rect x="-80" y="-18" width="160" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="-60" cy="0" r="5" fill="#10b981"/>
      <text x="-48" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#ffffff">🎯 ORQUESTADOR</text>
    </g>

    <!-- Sub-agents Nodes Level 1 -->
    <g transform="translate(-120, -15)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#0b1329" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">🏛️ Arquitectura</text>
    </g>

    <g transform="translate(0, -5)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#0b1329" stroke="url(#nodeActive)" stroke-width="1.8"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">🔀 Flujos de Negocio</text>
    </g>

    <g transform="translate(120, -15)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#0b1329" stroke="#818cf8" stroke-width="1.5"/>
      <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="middle">🗄️ Modelo ERD</text>
    </g>

    <!-- Modules Level 2 (Leaf nodes) -->
    <g transform="translate(-140, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">Metrics</text>
    </g>

    <g transform="translate(-60, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#030712" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399" text-anchor="middle">CVE Risk</text>
    </g>

    <g transform="translate(60, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">Tour Guide</text>
    </g>

    <g transform="translate(140, 65)">
      <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#030712" stroke="rgba(255,255,255,0.15)"/>
      <text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8" text-anchor="middle">Entities</text>
    </g>
  </g>

  <!-- Left Pill (Principio Cero Alucinaciones) -->
  <g transform="translate(30, 35)">
    <rect width="180" height="66" rx="8" fill="rgba(8, 14, 28, 0.92)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">RIGOR DE ANÁLISIS</text>
    <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#38bdf8">CERO ALUCINACIONES</text>
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">&lt;detectado&gt; vs &lt;inferido&gt;</text>
  </g>

  <!-- Right Pill (Multi-Agente 9 Especialistas) -->
  <g transform="translate(415, 35)">
    <rect width="155" height="66" rx="8" fill="rgba(8, 14, 28, 0.92)" stroke="rgba(129, 140, 248, 0.35)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">ARQUITECTURA IA</text>
    <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#a5b4fc">9 AGENTES IA</text>
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Next.js 16 + React 19</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(160, 285)">
    <rect width="280" height="34" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255,255,255,0.12)"/>
    <text x="140" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">github.com/LuchoDB/Cartografo</text>
  </g>
</svg>
