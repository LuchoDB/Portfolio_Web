<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cartoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#030b17"/>
    </linearGradient>
    <linearGradient id="gridCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#cartoBg)"/>

  <!-- Cartographic Coordinate Grid -->
  <g stroke="rgba(6, 182, 212, 0.12)" stroke-width="1">
    <line x1="60" y1="40" x2="540" y2="40"/>
    <line x1="60" y1="100" x2="540" y2="100"/>
    <line x1="60" y1="160" x2="540" y2="160"/>
    <line x1="60" y1="220" x2="540" y2="220"/>
    <line x1="60" y1="280" x2="540" y2="280"/>

    <line x1="120" y1="30" x2="120" y2="290"/>
    <line x1="200" y1="30" x2="200" y2="290"/>
    <line x1="280" y1="30" x2="280" y2="290"/>
    <line x1="360" y1="30" x2="360" y2="290"/>
    <line x1="440" y1="30" x2="440" y2="290"/>
    <line x1="520" y1="30" x2="520" y2="290"/>
  </g>

  <!-- Topographic Contour Lines (Curvas de Nivel) -->
  <g fill="none" stroke="rgba(56, 189, 248, 0.22)" stroke-width="1.8">
    <path d="M 60 210 Q 140 180, 240 220 T 420 180 T 540 210"/>
    <path d="M 60 170 Q 180 140, 300 170 T 480 130 T 540 160"/>
    <path d="M 80 130 Q 200 90, 320 130 T 460 90 T 540 110"/>
    <path d="M 120 90 Q 220 50, 330 80 T 440 60"/>
  </g>

  <!-- Obstacle Limitation Surface (SLO 3D Envelope Trapezoid) -->
  <g transform="translate(180, 70)">
    <!-- Approach funnel trapezoid -->
    <polygon points="40,160 200,160 230,40 10,40" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="2" stroke-dasharray="6 3"/>
    
    <!-- Runway Centerline in Surface -->
    <line x1="120" y1="160" x2="120" y2="40" stroke="#34d399" stroke-width="2.5"/>
    
    <!-- Runway Threshold Points -->
    <circle cx="120" cy="160" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="40" r="4" fill="#38bdf8"/>

    <rect x="75" y="166" width="90" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="179" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#a7f3d0" text-anchor="middle">UMBRAL RWY 18</text>
  </g>

  <!-- Left HUD (WGS-84 Coordinate Telemetry) -->
  <g transform="translate(30, 45)">
    <rect width="160" height="64" rx="8" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">GEORREFERENCIACIÓN</text>
    <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#38bdf8">34°35' S / 58°26' W</text>
    <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">Elipsoide WGS-84</text>
  </g>

  <!-- Right HUD (Obstáculos & Decl. Magnética) -->
  <g transform="translate(410, 45)">
    <rect width="160" height="64" rx="8" fill="rgba(10, 25, 47, 0.9)" stroke="rgba(16, 185, 129, 0.35)"/>
    <text x="12" y="20" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">DESPEJE DE OBSTÁCULOS</text>
    <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#10b981">SLO RAAC 153</text>
    <text x="12" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a7f3d0">Sin Penetración Crítica</text>
  </g>

  <!-- Bottom Badge -->
  <g transform="translate(180, 275)">
    <rect width="240" height="34" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255,255,255,0.1)"/>
    <text x="120" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Cartografía Aeronáutica &amp; GIS</text>
  </g>
</svg>
