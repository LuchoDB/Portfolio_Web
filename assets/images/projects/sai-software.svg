<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="saiSoftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#040912"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#saiSoftBg)"/>

  <!-- Cockpit HUD Grid -->
  <g stroke="rgba(56, 189, 248, 0.08)" stroke-width="1">
    <circle cx="300" cy="170" r="130" fill="none"/>
    <circle cx="300" cy="170" r="95" fill="none"/>
    <circle cx="300" cy="170" r="60" fill="none"/>
    <line x1="170" y1="170" x2="430" y2="170"/>
    <line x1="300" y1="40" x2="300" y2="300"/>
    <line x1="208" y1="78" x2="392" y2="262"/>
    <line x1="208" y1="262" x2="392" y2="78"/>
  </g>

  <!-- Interactive Wind Rose Vector (16 Rumbos) -->
  <g transform="translate(300, 170)">
    <!-- Cardinal Points Ring -->
    <text x="0" y="-105" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#38bdf8" text-anchor="middle">N 360°</text>
    <text x="110" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="start">E 090°</text>
    <text x="0" y="118" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">S 180°</text>
    <text x="-110" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">W 270°</text>

    <!-- Runway QFU Vector (e.g. 04 / 22) -->
    <line x1="-75" y1="75" x2="75" y2="-75" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <line x1="-75" y1="75" x2="75" y2="-75" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Runway Threshold Badges -->
    <rect x="-105" y="70" width="36" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="-87" y="83" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#34d399" text-anchor="middle">22</text>

    <rect x="70" y="-88" width="36" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="88" y="-75" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#34d399" text-anchor="middle">04</text>

    <!-- Wind Rose Petals -->
    <polygon points="0,-85 10,-35 0,-20 -10,-35" fill="url(#compassGrad)"/>
    <polygon points="0,85 10,35 0,20 -10,35" fill="rgba(56, 189, 248, 0.4)"/>
    <polygon points="85,0 35,10 20,0 35,-10" fill="rgba(56, 189, 248, 0.5)"/>
    <polygon points="-85,0 -35,10 -20,0 -35,-10" fill="rgba(56, 189, 248, 0.4)"/>

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
  </g>

  <!-- Left Technical Overlay (RAAC 153 / LAD) -->
  <g transform="translate(30, 40)">
    <rect width="165" height="74" rx="10" fill="rgba(10, 21, 38, 0.9)" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">ESTUDIO LAD / LADH</text>
    <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#38bdf8">RAAC 153 / 154</text>
    <text x="14" y="60" font-family="'Outfit', sans-serif" font-size="9.5" fill="#34d399">✓ Normativa ANAC / OACI</text>
  </g>

  <!-- Right Technical Overlay (Usabilidad OACI) -->
  <g transform="translate(405, 40)">
    <rect width="165" height="74" rx="10" fill="rgba(10, 21, 38, 0.9)" stroke="rgba(16, 185, 129, 0.35)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="600" fill="#94a3b8">VIENTO CRUZADO</text>
    <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#10b981">97.8% USABLE</text>
    <text x="14" y="60" font-family="'Outfit', sans-serif" font-size="9.5" fill="#a7f3d0">Coeficiente OACI ≥ 95%</text>
  </g>

  <!-- Bottom Platform Badge -->
  <g transform="translate(195, 275)">
    <rect width="210" height="34" rx="8" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255,255,255,0.1)"/>
    <text x="105" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Electron • React 19 • SQLite</text>
  </g>
</svg>
