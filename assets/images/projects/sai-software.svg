<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="softLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="windRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="lightPat" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(15, 23, 42, 0.05)"/>
    </pattern>
  </defs>

  <!-- Light Background -->
  <rect width="600" height="340" fill="url(#softLightBg)"/>
  <rect width="600" height="340" fill="url(#lightPat)"/>

  <!-- Radar / Vector Grid Lines -->
  <g stroke="rgba(37, 99, 235, 0.15)" stroke-width="1.2">
    <circle cx="300" cy="170" r="125" fill="none"/>
    <circle cx="300" cy="170" r="90" fill="none"/>
    <circle cx="300" cy="170" r="55" fill="none"/>
    <line x1="175" y1="170" x2="425" y2="170"/>
    <line x1="300" y1="45" x2="300" y2="295"/>
    <line x1="211" y1="81" x2="389" y2="259"/>
    <line x1="211" y1="259" x2="389" y2="81"/>
  </g>

  <!-- Vector Compass & Wind Rose in Center -->
  <g transform="translate(300, 170)">
    <text x="0" y="-100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#2563eb" text-anchor="middle">N 360°</text>
    <text x="105" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b" text-anchor="start">E 090°</text>
    <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">S 180°</text>
    <text x="-105" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b" text-anchor="end">W 270°</text>

    <!-- Vector Heading Line -->
    <line x1="-70" y1="70" x2="70" y2="-70" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

    <!-- Compass Rose Petals -->
    <polygon points="0,-80 10,-35 0,-20 -10,-35" fill="url(#windRoseGrad)"/>
    <polygon points="0,80 10,35 0,20 -10,35" fill="rgba(37, 99, 235, 0.3)"/>
    <polygon points="80,0 35,10 20,0 35,-10" fill="rgba(37, 99, 235, 0.4)"/>
    <polygon points="-80,0 -35,10 -20,0 -35,-10" fill="rgba(37, 99, 235, 0.3)"/>

    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
  </g>

  <!-- Left Card: Desktop Workstation -->
  <g transform="translate(30, 40)">
    <rect width="170" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#64748b">APP DE ESCRITORIO</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#0f172a">Electron + React</text>
    <text x="14" y="62" font-family="'Outfit', sans-serif" font-size="10" fill="#2563eb">SQLite Embebido Local</text>
  </g>

  <!-- Right Card: Vector Calculation -->
  <g transform="translate(400, 40)">
    <rect width="170" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#64748b">CÁLCULO VECTORIAL</text>
    <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#10b981">16 Rumbos Vector</text>
    <text x="14" y="62" font-family="'Outfit', sans-serif" font-size="10" fill="#059669">Rosa de Vientos Dinámica</text>
  </g>

  <!-- Bottom Tech Badge -->
  <g transform="translate(180, 275)">
    <rect width="240" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="120" y="23" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">github.com/LuchoDB/SAI_Software</text>
  </g>
</svg>
