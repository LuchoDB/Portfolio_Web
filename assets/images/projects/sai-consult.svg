<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="saiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f18"/>
      <stop offset="100%" stop-color="#040d0a"/>
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#saiBg)"/>

  <!-- Global Edge Network Globe Lines -->
  <g transform="translate(300, 170)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="40" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="40" ry="110" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
    
    <!-- Edge PoP Nodes -->
    <circle cx="-60" cy="-30" r="5" fill="#10b981"/>
    <circle cx="50" cy="20" r="6" fill="#06b6d4"/>
    <circle cx="10" cy="-60" r="4.5" fill="#34d399"/>
    <circle cx="-20" cy="50" r="5" fill="#38bdf8"/>
    
    <!-- Connection lines -->
    <path d="M-60 -30 L10 -60 L50 20 L-20 50 Z" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" fill="rgba(16, 185, 129, 0.05)"/>
  </g>

  <!-- Lighthouse 100 Badge -->
  <g transform="translate(230, 110)">
