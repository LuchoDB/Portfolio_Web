  <g transform="translate(420, 230)">
    <rect width="140" height="46" rx="8" fill="rgba(10, 25, 20, 0.85)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">Infraestructura</text>
    <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">Cloudflare Pages</text>
  </g>
