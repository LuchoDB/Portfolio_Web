    <circle cx="70" cy="45" r="28" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="3"/>
    <text x="70" y="52" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="900" fill="#10b981" text-anchor="middle">100</text>
    <text x="70" y="90" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">LIGHTHOUSE</text>
    <text x="70" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399" text-anchor="middle">CORE WEB VITALS</text>
  </g>

  <!-- Side Floating Tags -->
  <g transform="translate(40, 60)">
    <rect width="140" height="46" rx="8" fill="rgba(10, 25, 20, 0.85)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="14" y="20" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">Latencia Global TTFB</text>
    <text x="14" y="36" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981">&lt; 35ms CDN EDGE</text>
