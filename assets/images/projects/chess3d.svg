<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="chessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#070510"/>
    </linearGradient>
    <linearGradient id="pieceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#chessBg)"/>

  <!-- 3D Perspective Grid / Board -->
  <g transform="translate(300, 230) scale(1, 0.48) rotate(45)">
    <!-- Board Base -->
    <rect x="-140" y="-140" width="280" height="280" rx="8" fill="#181335" stroke="#8b5cf6" stroke-width="3"/>
    <!-- 8x8 Grid simulation -->
    <g stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5">
      <line x1="-105" y1="-140" x2="-105" y2="140"/>
      <line x1="-70" y1="-140" x2="-70" y2="140"/>
      <line x1="-35" y1="-140" x2="-35" y2="140"/>
      <line x1="0" y1="-140" x2="0" y2="140"/>
      <line x1="35" y1="-140" x2="35" y2="140"/>
      <line x1="70" y1="-140" x2="70" y2="140"/>
      <line x1="105" y1="-140" x2="105" y2="140"/>

      <line x1="-140" y1="-105" x2="140" y2="-105"/>
      <line x1="-140" y1="-70" x2="140" y2="-70"/>
      <line x1="-140" y1="-35" x2="140" y2="-35"/>
      <line x1="-140" y1="0" x2="140" y2="0"/>
      <line x1="-140" y1="35" x2="140" y2="35"/>
      <line x1="-140" y1="70" x2="140" y2="70"/>
      <line x1="-140" y1="105" x2="140" y2="105"/>
    </g>

    <!-- Checker fill accents -->
    <rect x="-140" y="-140" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="-70" y="-140" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="0" y="-140" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="70" y="-140" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="-105" y="-105" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="-35" y="-105" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="35" y="-105" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
    <rect x="105" y="-105" width="35" height="35" fill="rgba(139, 92, 246, 0.3)"/>
  </g>

  <!-- Glowing Knight / Queen Stylized Silhouette in 3D Space -->
  <g transform="translate(265, 80)">
    <!-- Base Glow -->
    <ellipse cx="35" cy="115" rx="45" ry="12" fill="#8b5cf6" opacity="0.4"/>
    <!-- Knight Piece Silhouette -->
    <path d="M20 110 C20 95, 25 80, 20 65 C15 50, 30 35, 45 28 C48 20, 55 18, 55 24 C55 30, 48 35, 52 42 C56 46, 62 48, 58 58 C52 68, 48 70, 52 85 C55 95, 58 105, 58 110 Z" fill="url(#pieceGrad)" stroke="#c084fc" stroke-width="2"/>
    <circle cx="42" cy="40" r="3" fill="#ffffff"/>
  </g>

  <!-- Technical Overlay HUD -->
  <g transform="translate(40, 45)">
    <rect width="145" height="52" rx="10" fill="rgba(24, 19, 53, 0.85)" stroke="rgba(168, 85, 247, 0.35)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" fill="#a5b4fc">Motor WebGL / Three.js</text>
    <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8">60 FPS ESTABLE</text>
  </g>

  <g transform="translate(415, 45)">
    <rect width="145" height="52" rx="10" fill="rgba(24, 19, 53, 0.85)" stroke="rgba(168, 85, 247, 0.35)"/>
    <text x="14" y="22" font-family="'Outfit', sans-serif" font-size="10.5" fill="#a5b4fc">Algoritmo de IA</text>
    <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#c084fc">Minimax + AlphaBeta</text>
  </g>
</svg>
