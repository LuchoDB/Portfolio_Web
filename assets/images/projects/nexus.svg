<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="nexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d"/>
      <stop offset="100%" stop-color="#020a14"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#nexBg)"/>

  <!-- Telemetry Oscilloscope Grid -->
  <g stroke="rgba(6, 182, 212, 0.12)" stroke-width="1">
    <line x1="40" y1="80" x2="560" y2="80"/>
    <line x1="40" y1="140" x2="560" y2="140"/>
    <line x1="40" y1="200" x2="560" y2="200"/>
    <line x1="40" y1="260" x2="560" y2="260"/>

    <line x1="100" y1="50" x2="100" y2="290"/>
    <line x1="200" y1="50" x2="200" y2="290"/>
    <line x1="300" y1="50" x2="300" y2="290"/>
    <line x1="400" y1="50" x2="400" y2="290"/>
    <line x1="500" y1="50" x2="500" y2="290"/>
  </g>

  <!-- Live Pulse Waveform Line -->
  <path d="M 40 200 L 120 200 L 150 120 L 170 230 L 190 170 L 210 200 L 290 200 L 320 90 L 340 240 L 360 180 L 380 200 L 460 200 L 480 150 L 500 200 L 560 200" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pulse Glow Point -->
  <circle cx="320" cy="90" r="6" fill="#ffffff"/>
  <circle cx="320" cy="90" r="14" fill="#06b6d4" opacity="0.4"/>

  <!-- Telemetry HUD Badge -->
  <g transform="translate(60, 45)">
    <rect width="170" height="42" rx="8" fill="rgba(6, 25, 45, 0.85)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="14" y="18" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">STREAMING WEBSOCKETS</text>
    <text x="14" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#38bdf8">100ms Telemetry Sync</text>
  </g>

  <g transform="translate(370, 45)">
    <rect width="170" height="42" rx="8" fill="rgba(6, 25, 45, 0.85)" stroke="rgba(6, 182, 212, 0.3)"/>
    <text x="14" y="18" font-family="'Outfit', sans-serif" font-size="10" fill="#94a3b8">HEURÍSTICA DE CARGA</text>
    <text x="14" y="34" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981">Zero-Drop Memory Pool</text>
  </g>
</svg>
