<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241706"/>
      <stop offset="100%" stop-color="#0e0802"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#pyBg)"/>

  <!-- Binary Search Tree / Graph Visual -->
  <g transform="translate(300, 70)">
    <!-- Root -->
    <circle cx="0" cy="0" r="18" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#000" text-anchor="middle">50</text>
    
    <!-- Edges Level 1 -->
    <line x1="-12" y1="12" x2="-70" y2="60" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>
    <line x1="12" y1="12" x2="70" y2="60" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2"/>

    <!-- Nodes Level 1 -->
    <circle cx="-70" cy="65" r="16" fill="#1e180e" stroke="#f59e0b" stroke-width="2"/>
    <text x="-70" y="70" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">25</text>
    
    <circle cx="70" cy="65" r="16" fill="#1e180e" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="70" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">75</text>

    <!-- Edges Level 2 -->
    <line x1="-80" y1="80" x2="-120" y2="130" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <line x1="-60" y1="80" x2="-30" y2="130" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="30" y2="130" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
    <line x1="80" y1="80" x2="120" y2="130" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>

    <!-- Nodes Level 2 -->
    <circle cx="-120" cy="135" r="14" fill="#1e180e" stroke="#d97706" stroke-width="1.5"/>
    <text x="-120" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">12</text>

    <circle cx="-30" cy="135" r="14" fill="#1e180e" stroke="#d97706" stroke-width="1.5"/>
    <text x="-30" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">38</text>

    <circle cx="30" cy="135" r="14" fill="#1e180e" stroke="#d97706" stroke-width="1.5"/>
    <text x="30" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">62</text>

    <circle cx="120" cy="135" r="14" fill="#1e180e" stroke="#d97706" stroke-width="1.5"/>
    <text x="120" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">90</text>
  </g>

  <!-- Big O Complexity Curve Frame -->
  <g transform="translate(190, 240)">
    <rect width="220" height="70" rx="10" fill="rgba(30, 20, 10, 0.85)" stroke="rgba(245, 158, 11, 0.3)"/>
    <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="11" fill="#cbd5e1">Búsqueda Balanceada</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#f59e0b">O(log n) Benchmarked</text>
  </g>
</svg>
