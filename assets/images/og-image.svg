<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040812"/>
      <stop offset="40%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#0f1e38"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGrid)"/>

  <!-- Ambient Glows -->
  <circle cx="250" cy="150" r="300" fill="#38bdf8" opacity="0.1" filter="blur(70px)"/>
  <circle cx="950" cy="450" r="320" fill="#3b82f6" opacity="0.1" filter="blur(70px)"/>

  <!-- Brand Emblem -->
  <g transform="translate(100, 95)">
    <rect width="70" height="50" rx="10" fill="#0f172a" stroke="url(#textGrad)" stroke-width="2"/>
    <text x="35" y="34" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" letter-spacing="1" fill="url(#textGrad)" text-anchor="middle">LDB</text>
    <text x="95" y="34" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#ffffff">Luciano Díaz Bertozzi</text>
  </g>

  <!-- Big Title -->
  <g transform="translate(100, 230)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
      Ingeniería de Software para
    </text>
    <text x="0" y="75" font-family="'Outfit', sans-serif" font-size="58" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.03em">
      Sistemas Críticos &amp; Aeronáutica
    </text>
  </g>

  <!-- Description -->
  <g transform="translate(100, 375)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="23" fill="#94a3b8">
      Sistemas de Factibilidad RAAC 153/154 • Cartografía Aeronáutica • Arquitecturas Cloud Edge &amp; Desktop
    </text>
  </g>

  <!-- Metric Badges Bottom -->
  <g transform="translate(100, 465)">
    <rect width="250" height="74" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
    <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">SISTEMAS AERONÁUTICOS</text>
    <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="800" fill="#38bdf8">SAI Consult &amp; Soft</text>

    <g transform="translate(270, 0)">
      <rect width="250" height="74" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
      <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">ESTÁNDARES NORMATIVOS</text>
      <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="800" fill="#10b981">ANAC / OACI Anexo 14</text>
    </g>

    <g transform="translate(540, 0)">
      <rect width="250" height="74" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.12)"/>
      <text x="20" y="30" font-family="'Outfit', sans-serif" font-size="12" fill="#94a3b8">GEOESPACIAL &amp; GIS</text>
      <text x="20" y="56" font-family="'JetBrains Mono', monospace" font-size="19" font-weight="800" fill="#818cf8">Cartógrafo SLO</text>
    </g>
  </g>
</svg>
