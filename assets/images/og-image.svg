<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(15, 23, 42, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogLightBg)"/>
  <rect width="1200" height="630" fill="url(#lightGrid)"/>

  <!-- Top Badge -->
  <g transform="translate(100, 90)">
    <rect width="52" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="26" y="38" font-family="'Outfit', sans-serif" font-size="30" font-weight="900" fill="url(#primaryGrad)" text-anchor="middle">L</text>
    <text x="75" y="36" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#0f172a">Luciano Díaz Bertozzi</text>
  </g>

  <!-- Sub-Badge (UTN - FRP) -->
  <g transform="translate(100, 170)">
    <rect width="450" height="38" rx="19" fill="rgba(37, 99, 235, 0.08)" stroke="rgba(37, 99, 235, 0.25)" stroke-width="1"/>
    <text x="24" y="24" font-family="'Outfit', sans-serif" font-size="16" font-weight="600" fill="#2563eb">🎓 Tecnicatura Universitaria en Programación • UTN FRP</text>
  </g>

  <!-- Headline -->
  <g transform="translate(100, 260)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="54" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
      Desarrollador de Software &amp;
    </text>
    <text x="0" y="65" font-family="'Outfit', sans-serif" font-size="54" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.02em">
      Portafolio de Proyectos
    </text>
  </g>

  <!-- Description -->
  <g transform="translate(100, 390)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="22" fill="#475569">
      Aplicaciones de Escritorio con Electron • Plataformas Web Edge • Next.js &amp; React 19 • TypeScript
    </text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(100, 460)">
    <rect width="280" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#64748b">PROYECTO DESKTOP</text>
    <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#0f172a">SAI Software</text>

    <g transform="translate(305, 0)">
      <rect width="280" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="24" y="32" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#64748b">TOOLING DE SOFTWARE</text>
      <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#2563eb">Cartógrafo</text>
    </g>

    <g transform="translate(610, 0)">
      <rect width="280" height="80" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="24" y="32" font-family="'Outfit', sans-serif" font-size="13" font-weight="600" fill="#64748b">WEB EDGE &amp; PERFORMANCE</text>
      <text x="24" y="58" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#10b981">SAI Consult 100/100</text>
    </g>
  </g>
</svg>
